name: Deploy

# Every push to main, and every night, is a deploy to GitHub Pages. Each run first syncs the
# crate data from crates.io, so a release shows up by the next morning; a sync that fails (a
# README section the site may not show, say) leaves the last deploy in place. Nothing is
# published that has not passed `task ci`; the site lands at the root of the artifact,
# Storybook under storybook/.
#
# After a deploy that changed the site, the notify job tells IndexNow (Bing, Yandex and
# others) about every sitemap URL and asks the Wayback Machine to archive the site.
#
# One-time setup: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
    # Docs alone do not deploy; the Markdown under content/ is page text and does.
    paths: ['**', '!**/*.md', 'content/**/*.md']
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.deploy-id.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `$/` (zizmor self-repository) is not yet understood by actionlint 1.7.12.
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository]
      - run: task sync
      - run: task ci
      # The commit plus the synced data identify what is deployed. The nightly run with
      # nothing new matches the live id, so search engines are not pinged for it.
      - id: deploy-id
        env:
          SITE_URL: https://sunsided.github.io/planning-and-search
        run: |
          id="$(git rev-parse HEAD) $(cat src/lib/data/*.json | sha256sum | cut -d' ' -f1)"
          live="$(curl -fsS --max-time 30 "$SITE_URL/deploy-id.txt" || true)"
          printf '%s\n' "$id" > build/deploy-id.txt
          if [ "$live" = "$id" ]; then changed=false; else changed=true; fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write # deploy-pages proves the artifact came from this run
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  notify:
    needs: [build, deploy]
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    env:
      SITE_URL: https://sunsided.github.io/planning-and-search
      # Public by design: IndexNow reads it back from static/<key>.txt to prove ownership.
      # A key below the host root may only submit URLs under its directory, as here.
      INDEXNOW_KEY: 53f6ce75220a1a41743ecd7ffacf52ee
    steps:
      - name: IndexNow
        shell: bash # -o pipefail: an empty sitemap fetch must fail the step
        run: |
          served="$(curl -fsS --max-time 30 "$SITE_URL/$INDEXNOW_KEY.txt")"
          [ "$served" = "$INDEXNOW_KEY" ] || { echo "::error::key file does not hold the key"; exit 1; }
          curl -fsS --max-time 30 "$SITE_URL/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' |
            jq -R . | jq -s --arg key "$INDEXNOW_KEY" --arg loc "$SITE_URL/$INDEXNOW_KEY.txt" \
              '{host: "sunsided.github.io", key: $key, keyLocation: $loc, urlList: .}' > body.json
          echo "Submitting $(jq '.urlList | length' body.json) URLs"
          # 200: received; 202: received, key check pending. Anything else fails the step.
          curl -sS --fail-with-body --max-time 60 -H 'Content-Type: application/json; charset=utf-8' \
            --data @body.json -w 'HTTP %{http_code}\n' https://api.indexnow.org/indexnow

      # Save Page Now 2 with archive.org S3 keys (archive.org/account/s3.php). The home page
      # links every crate page and each crate page links its algorithms, so capturing those
      # with their outlinks (at most 100 each) reaches every page. A capture with outlinks
      # holds one of the account's few concurrent sessions for minutes, so each submission
      # waits until /save/status/user reports a free one (and 9 s for the 7-a-minute limit).
      # Captures finish asynchronously; a failure here never fails the run.
      - name: Wayback Machine
        if: ${{ !cancelled() }} # independent of IndexNow
        continue-on-error: true
        timeout-minutes: 45
        shell: bash
        env:
          ACCESS: ${{ secrets.ARCHIVE_ORG_ACCESS_KEY }}
          SECRET: ${{ secrets.ARCHIVE_ORG_SECRET_KEY }}
        run: |
          if [ -z "$ACCESS" ] || [ -z "$SECRET" ]; then
            echo "::notice::ARCHIVE_ORG_ACCESS_KEY or ARCHIVE_ORG_SECRET_KEY unset; skipping"
            exit 0
          fi
          { echo "$SITE_URL/"; curl -fsS --max-time 30 "$SITE_URL/sitemap.xml" |
            grep -o '<loc>[^<]*/crates/[^<]*' | sed 's/<loc>//'; } |
          while read -r url; do
            for _ in $(seq 30); do
              free="$(curl -sS --max-time 30 -H "Authorization: LOW $ACCESS:$SECRET" \
                https://web.archive.org/save/status/user | jq -r '.available // 0' || echo 1)" # unreadable status: just try
              [ "$free" -gt 0 ] 2>/dev/null && break
              sleep 20
            done
            curl -sS --max-time 60 -H 'Accept: application/json' \
              -H "Authorization: LOW $ACCESS:$SECRET" \
              --data-urlencode "url=$url" -d capture_outlinks=1 -d if_not_archived_within=1d \
              https://web.archive.org/save || true
            echo
            sleep 9
          done
